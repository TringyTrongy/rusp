name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # A hung test must fail with logs rather than occupy a runner for hours.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --all-targets

      # Each test binary runs as its own step with its own budget. `cargo
      # test` stops at the first binary that fails, which hides everything
      # after it, and a single combined step cannot say *which* binary hung.
      #
      # Local-network discovery binds a shared UDP port. Those tests skip
      # themselves if the port is taken, and reach the responder over loopback
      # so they do not depend on the runner carrying multicast.
      - name: Unit tests
        timeout-minutes: 5
        run: cargo test --lib -- --nocapture

      - name: Transfer tests
        timeout-minutes: 5
        run: cargo test --test transfer -- --nocapture

      - name: Security tests
        timeout-minutes: 5
        run: cargo test --test security -- --nocapture

      - name: CLI tests
        timeout-minutes: 5
        run: cargo test --test cli -- --nocapture

      - name: Build release
        run: cargo build --release

  lint:
    name: fmt, clippy, docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Documentation
        run: cargo doc --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  minimum-rust-version:
    name: rust 1.85
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --all-targets
